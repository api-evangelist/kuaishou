  api: kuaishou:open-platform
  official: true
  loader:
    registry: npm
    package: kma-ui
    version: 0.0.4-alpha
    published: '2024-05-24'
    install: npm i kma-ui --save
  usage: >-
    Register in app.json or [page].json, e.g. {"usingComponents": {"k-icon": "kma-ui/icon/index"}},
