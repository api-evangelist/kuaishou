notes: >-
  Client-side UI surfaces Kuaishou publishes for developers. These are mini-program components, not
  web-embeddable widgets: they are consumed inside a Kuaishou mini program via `usingComponents` in
  app.json or a page's .json, and rendered in KSML. Component names are transcribed from the provider's
  own documentation route table; no component is invented. Distinct from the SDKs recorded in
  packages/kuaishou-packages.yml.
families:
