discovery:
  probe:
    method: POST
    url: https://kling.ai/mcp
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    accept: application/json, text/event-stream
    http_status: 401
    www_authenticate: Bearer resource_metadata=https://kling.ai/.well-known/oauth-protected-resource/mcp
    fetched: '2026-08-12'
  gated: true
  gated_note: >-
    The live tools/list schema is OAuth-gated. Tool NAMES below are not guessed: they are published by
    Kuaishou in the README of its own @klingai/cli-global npm package, which states "CLI commands map
    1:1 to backend MCP tools" and names each one. The full inputSchema for each tool requires an
    authenticated tools/list call and is therefore NOT recorded here.
authorization:
  type: oauth2
  spec: RFC 9728 protected resource + RFC 8414 authorization server metadata
  authorization_server: https://kling.ai/auth
  authorization_endpoint: https://kling.ai/auth/authorize
  token_endpoint: https://kling.ai/auth/token
  registration_endpoint: https://kling.ai/auth/register
  revocation_endpoint: https://kling.ai/auth/revoke
  jwks_uri: https://kling.ai/auth/.well-known/jwks.json
  grant_types: [authorization_code, refresh_token]
  pkce: S256
  dynamic_client_registration: true
  token_endpoint_auth_methods: [none]
  scopes: [generation.create, generation.read, account.credit.read]
  detail: scopes/kuaishou-scopes.yml
tools:
- name: who_am_i
  description: >-
    Return current identity plus the models and parameter specs the server currently makes available.
    The CLI calls this for capability discovery before every generation command.
  source: '@klingai/cli-global README + dist/cli.js callMcpTool("who_am_i")'
- name: text_to_image
  description: Submit a text-to-image generation task.
  source: '@klingai/cli-global README command table'
- name: image_to_image
  description: Generate from one or more reference images.
  source: '@klingai/cli-global README command table'
- name: text_to_video
  description: Submit a text-to-video generation task.
  source: '@klingai/cli-global README command table'
- name: image_to_video
  description: Submit an image-to-video generation task.
  source: '@klingai/cli-global README command table'
- name: query_tasks
  description: Query generation status and result URLs for a generationId.
  source: '@klingai/cli-global dist/cli.js callMcpTool("query_tasks", { generationId })'
- name: file_upload
  description: >-
    Two-step upload. The tool returns a ticket and an uploadUrl; the client PUTs the file to that URL
    and receives a public asset URL back.
  source: '@klingai/cli-global dist/cli.js callMcpTool("file_upload", { filename, contentType, size })'
- name: query_membership_and_credits
  description: Query membership tier and available credits. Exposed by the CLI as `kling account`.
  source: '@klingai/cli-global dist/cli.js COMMAND_TO_MCP_TOOL = { account: "query_membership_and_credits" }'
tool_count: 8
clients:
- name: Kling CLI (global)
  package: '@klingai/cli-global'
  registry: npm
  official: true
  note: >-
    Described by Kuaishou as a "thin MCP client"; `kling tool_list` performs a live tools/list against
    this server, and per-command help fetches the live tool declaration and input schema.
- name: Kling CLI (China)
  package: '@klingai/cli-cn'
  registry: npm
  official: true
constraints:
  published: >-
    Kuaishou's MCP/CLI guide states that bonus credits are valid on official Kling AI platforms only and
    cannot currently be used with MCP or CLI, and that MCP and CLI currently support only paid credits
    from the Personal workspace.
  source: https://kling.ai/app/mcp/guide
docs:
- https://kling.ai/app/mcp
- https://kling.ai/app/mcp/guide
- https://kling.ai/app/cli
gaps:
- >-
  Per-tool inputSchema is not recorded. An anonymous tools/list returns 401; obtaining the schemas
  requires completing the OAuth authorization-code flow with a real Kling account, which this pipeline
  does not do.
- >-
  The Kling API reference at https://kling.ai/document-api is a JavaScript single-page application whose
  content is fetched at runtime, so the REST operation catalogue behind these tools could not be
  harvested; no OpenAPI is published, so no tool crosswalk is produced.
