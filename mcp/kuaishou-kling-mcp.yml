name: Kling AI MCP Server
api: kuaishou:kling-ai
status: published
hosted: true
transport: streamable-http
url: https://kling.ai/mcp
ownership_note: >-
  kling.ai is Kuaishou Technology's Kling AI platform. The provider's own llms.txt at
  https://kling.ai/llms.txt states "Kling AI is a next-generation AI creative productivity platform
  developed by Kuaishou Technology" and lists "Parent company: Kuaishou Technology (HKEX: 1024)". The
