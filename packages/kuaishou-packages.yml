notes: >-
  Round 1 concluded "no official API client SDK exists on any public registry". That was wrong, and this
  round corrects it. Kuaishou publishes at least four first-party packages that are API clients or
  API-adjacent tooling: ks-miniprogram-ci (the Open Platform code upload/preview client, documented in
  Kuaishou's own developer tools reference), kma-ui (the official mini-program component library), and
  @klingai/cli-global / @klingai/cli-cn (the official Kling AI CLI, a thin MCP client whose npm
  repository field points at git.corp.kuaishou.com). Because at least one first-party client library is
  published, an SDKs pointer IS wired into apis.yml this round.
  Every entry carries structured `version:` and `published:` fields read from the registry metadata
  endpoint. Where a registry did not answer or the package does not exist, `version: null` is recorded
  with a note rather than a guess.
