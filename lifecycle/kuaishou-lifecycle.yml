notes: >-
  Kuaishou runs three API surfaces with three different lifecycle postures. Kling AI versions
  aggressively and publicly by MODEL ID and keeps the old ones callable. The Open Platform versions by
  mini-program base library and by operational-rules revision. Kwai for Business publishes nothing. No
  surface emits RFC 8594 Sunset or Deprecation headers, and no surface publishes a formal deprecation
  policy with a notice period — that is the gap.
