      A dated log of changes to the platform's operating rules (not the API). Most recent entry
      2024-09-03, a restructure of the operations documentation.
  review_gate: >-
    Every mini-program version passes platform review before release; version review rules are published
    at /docs/operate/Hierarchy/versioninformationreview/versionReview.html.
- api: kuaishou:kwai-for-business
