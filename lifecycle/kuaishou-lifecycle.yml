apis:
- api: kuaishou:kling-ai
  versioning:
    scheme: model-id
    detail: >-
      Callers select a model by API ID (kling-v3, kling-v3-omni, kling-video-o1, kling-v2-6,
      kling-v2-5-turbo, kling-v2-1, kling-v2-master, kling-v1-6, kling-v1-5, kling-v1) rather than by a
      URL version segment; the REST path itself is /v1/. Available models and their parameter specs are
      discoverable at runtime through the who_am_i MCP tool.
    current: Kling 3.0 series (kling-v3, kling-v3-omni), released 2026-02-05
  release_cadence: >-
    Rapid. The published ladder runs 1.0 (2024-06) -> 1.5/1.6 (late 2024) -> 2.0 (2025-04) -> 2.1
    (2025-05) -> 2.5 Turbo (2025-09) -> Video O1 (2025-12) -> 2.6 (2025-12) -> 3.0 / 3.0 Omni
    (2026-02): eight generations in twenty months.
  superseded_models:
  - id: kling-v2-1
    status: legacy
    provider_wording: largely superseded by 2.5/2.6
    retired: false
  - id: kling-v2-master
    status: legacy
    provider_wording: superseded by 2.1 and later
    retired: false
  - id: kling-v1-6
    status: legacy
    retired: false
  - id: kling-v1-5
    status: legacy
    retired: false
  - id: kling-v1
    status: legacy
    provider_wording: first public DiT-based video generation model
    retired: false
  retirement_note: >-
    No model is documented as retired or scheduled for retirement. Superseded models remain listed with
    live prices — the cheapest published rate on the platform ($0.0035 per image) belongs to the
    original kling-v1. That is a consumer-friendly posture, but it is a posture, not a commitment: no
    document promises how long a model stays callable.
  changelog: changelog/kuaishou-changelog.yml
- api: kuaishou:open-platform
  versioning:
    scheme: base-library + path-segment
    detail: >-
      The mini-program runtime is versioned as a "基础库" (base library) with its own update log; server
      API routes carry a product/segment path rather than a global version prefix. A "-new" suffix
      appears on the current generation of payment and error-code documents (epay/open-api-new,
      errorCode-new), with the pre-"-new" documents no longer linked.
  compatibility_tooling:
    runtime_check: ks.canIUse
