    status: 200
    content_type: application/json;charset=UTF-8
    real: true
    file: kuaishou-kling-oauth-authorization-server.json
    spec: RFC 8414 OAuth 2.0 Authorization Server Metadata
    note: >-
      Issuer https://kling.ai/auth. Declares authorization/token/registration/revocation endpoints,
