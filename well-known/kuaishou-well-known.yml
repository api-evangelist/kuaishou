  - path: /.well-known/oauth-protected-resource
    status: 200
    content_type: application/json
    real: true
    file: kuaishou-kling-oauth-protected-resource.json
    spec: RFC 9728 OAuth 2.0 Protected Resource Metadata
    note: >-
      Advertises resource https://kling.ai/mcp, authorization server https://kling.ai/auth and three
      scopes (generation.create, generation.read, account.credit.read). The same body is served at
      /.well-known/oauth-protected-resource/mcp, which is the path named in the WWW-Authenticate
      challenge returned by the MCP endpoint.
  - path: /.well-known/oauth-protected-resource/mcp
    status: 200
    content_type: application/json
    real: true
