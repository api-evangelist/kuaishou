notes: >-
  Round 2 changed this result. The Kuaishou and Kwai hosts still publish nothing under /.well-known/ —
  most of them answer every /.well-known/* path with HTTP 200 and the site's JavaScript single-page
  application shell (text/html, identical byte length for every path), which is a catch-all soft 404 and
  NOT a discovery document. But kling.ai — Kuaishou Technology's Kling AI platform, which the company's
  own llms.txt names as "developed by Kuaishou Technology (HKEX: 1024)" — returns honest 404s for the
  standard paths AND serves two REAL machine-readable documents for its MCP server: an RFC 9728 OAuth
  Protected Resource Metadata document and an RFC 8414 Authorization Server Metadata document. Both are
  saved verbatim beside this index. Because at least one path now returns a genuine document, a
  WellKnown pointer IS wired into apis.yml. No security.txt is served on any host, so no SecurityTxt
  pointer is emitted.
