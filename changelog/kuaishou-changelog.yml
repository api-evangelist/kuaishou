notes: >-
  Kuaishou publishes two dated change logs and neither is an API changelog in the conventional sense.
  Kling AI keeps a release-notes section with 30 entries; the index and the URLs are public and dated,
  but each entry's body is rendered client-side and could not be read, so the highlights below are
  taken from the provider's OWN llms.txt version ladder rather than paraphrased from pages we could not
  see. The Kuaishou Open Platform publishes an operating-rules change log, which is a policy log, not
  an API log. No breaking-change register exists for any surface.
