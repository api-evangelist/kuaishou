aid: kuaishou
name: Kuaishou
description: 'Kuaishou Technology (快手) is a Beijing-based short-video and live-streaming platform operating
  Kuaishou in mainland China and Kwai internationally, spanning short video, live commerce, local services
  and online marketing. Its developer surface is split across two public properties: the Kuaishou Open
  Platform (open.kuaishou.com), which exposes an OAuth 2.0 authorization-code flow and a JSON Open API
  for third-party apps, mini programs and merchant integrations; and Kwai for Business (developers.kwai.com),
  the international marketing/advertising API used by advertisers and measurement partners. A third and
  markedly more open surface is Kling AI (kling.ai), Kuaishou''s generative video and image platform,
  which ships an asynchronous REST API, an official CLI, a hosted MCP server with published OAuth scopes,
  and the only llms.txt Kuaishou serves anywhere. Kuaishou also publishes open source under the Kwai
  GitHub organization. The Open Platform console and the Kwai for Business portal are JavaScript
  single-page applications, largely Chinese-language and gated behind developer registration, but the
  mini-program documentation subtree at open.kuaishou.com/docs is server-rendered and publicly readable,
  so this profile records endpoints and pages verified by live HTTP probe or read from that subtree.'
