apis:
- aid: kuaishou:open-platform
  name: Kuaishou Open Platform API
  description: 'The Kuaishou Open Platform (快手开放平台) exposes a JSON HTTP API for third-party applications,
    mini programs and merchant tools built on Kuaishou. Access is granted through a standard OAuth 2.0
    authorization-code flow (/oauth2/authorize plus /oauth2/access_token) and API calls are made against
    the /openapi path. Responses use a Kuaishou-specific envelope carrying a numeric result code, an
    error_msg and a request_id for support correlation.'
  humanURL: https://open.kuaishou.com/
  baseURL: https://open.kuaishou.com/openapi
