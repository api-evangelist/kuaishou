- aid: kuaishou:kwai-for-business
  name: Kwai for Business Marketing API
  description: 'Kwai for Business is Kuaishou''s international advertising and marketing platform for the
    Kwai app. Its developer portal at developers.kwai.com documents a marketing API served from the
    /rest/n/mapi path, used by advertisers, agencies and measurement partners for campaign, creative and
    reporting workflows. The service returns a JSON error envelope (timestamp, status, error, message,
    path) on unrouted requests.'
