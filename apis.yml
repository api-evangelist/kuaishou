x-enrichment:
  date: '2026-08-12'
  status: enriched
  artifacts_added: 13
  pass: local-v1
  note: >-
    Round 2 found a third API surface — Kling AI (kling.ai), which the provider's own llms.txt attributes
    to Kuaishou Technology — carrying a hosted MCP server at https://kling.ai/mcp with RFC 9728/RFC 8414
    metadata and three published OAuth scopes, an official CLI on npm, and a full public price list. It
    also corrected round 1's finding that the Kuaishou developer docs are uncrawlable: the mini-program
    subtree at open.kuaishou.com/docs is server-rendered and yielded the published error-code tables,
    rate limits, CLI reference and component library. Still no OpenAPI, AsyncAPI, security.txt, agent
    card, status page or trust center anywhere.
