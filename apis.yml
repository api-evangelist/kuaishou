- aid: kuaishou:kling-ai
  name: Kling AI API
  description: 'Kling AI (可灵) is Kuaishou Technology''s generative video and image platform, launched in
    June 2024 and, by the company''s own account, responsible for over 600 million generated videos and
    30,000+ enterprise customers. It exposes an asynchronous REST API for text-to-video, image-to-video,
    text-to-image, image editing, motion control and virtual try-on, served from api-singapore.klingai.com
    globally and api-beijing.klingai.com in China, authenticated with a self-signed JWT built from an
    Access Key ID and Secret. Callers select a generation model by API ID (kling-v3, kling-v3-omni,
    kling-video-o1, kling-v2-6 and earlier), submit a task, then poll by generationId. Kuaishou also runs
    a hosted MCP server for the same capability set at https://kling.ai/mcp, gated by an OAuth 2.1-style
    authorization-code flow with PKCE and dynamic client registration, and ships an official CLI
    (@klingai/cli-global) that is a thin client over it. Kling AI is the only Kuaishou property that
    publishes an llms.txt, RFC 9728 protected-resource metadata and RFC 8414 authorization-server
    metadata.'
  humanURL: https://kling.ai/dev
  baseURL: https://api-singapore.klingai.com
