format: proprietary
notes: >-
  Round 1 recorded only three probe-observed codes and flagged the published registry as unreachable.
  It is reachable: the Kuaishou mini-program documentation at open.kuaishou.com/docs is a
  server-rendered VuePress site, not the JavaScript SPA that fronts the rest of the portal, and it
  publishes three separate error-code tables. Those tables are transcribed below with the provider's
  own Chinese text preserved verbatim alongside an English reading. Kuaishou does not use RFC 9457
  application/problem+json anywhere. No code is invented; where the provider gives no explanation the
  `meaning` field is left null rather than filled in.
envelopes:
- api: kuaishou:open-platform
  media_type: application/json
  shape:
    result: integer result code (1 = success on mini-program server APIs; non-zero codes signal failure elsewhere)
    error_msg: human-readable message, usually Chinese-language
    request_id: opaque correlation id returned per request
    error: OAuth 2.0 error identifier, present on /oauth2/* responses only
  http_status_note: >-
    The Open API returns HTTP 200 for application-level errors and signals failure in the `result`
    field; an HTTP 404 is used for unrouted paths and still carries the same JSON envelope.
  trace_headers: [X-REQUEST-ID, X-KSLOGID]
- api: kuaishou:kwai-for-business
  media_type: application/json;charset=UTF-8
  shape:
    timestamp: server time of the failure
    status: HTTP status code, repeated in the body
    error: HTTP reason phrase
    message: detail message, "No message available" when absent
    path: the request path that failed
  http_status_note: Standard HTTP status codes; the body mirrors the status.
- api: kuaishou:kling-ai
  media_type: application/json;charset=UTF-8
  shape:
    code: integer business error code
    message: English-language message
    request_id: UUID correlation id
  http_status_note: >-
    Kling AI uses real HTTP status codes AND a business code. An unauthenticated call returns HTTP 401
    with {"code":1001,"message":"Authorization is empty","request_id":"<uuid>"}.
  trace_field: request_id
