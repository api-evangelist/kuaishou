  method: probed
- code: 1001
  api: kuaishou:kling-ai
  message: Authorization is empty
  title: Missing Authorization header
  meaning: >-
    The Kling AI REST API requires a JWT bearer token in the Authorization header; a request without one
    is rejected before any business logic runs.
  http_status: 401
  remediation: 'Sign a JWT with your Access Key ID and Access Key Secret and send Authorization: Bearer <token>.'
  evidence: >-
    POST https://api-singapore.klingai.com/v1/videos/text2video ->
    {"code":1001,"message":"Authorization is empty","request_id":"4930e02d-acff-46c2-be05-8209d51857e6"}
    (identical response from https://api-beijing.klingai.com)
  method: probed
- code: 404
  api: kuaishou:kling-ai
  message: Not Found
  title: Unrouted Kling API path
  http_status: 404
  evidence: >-
    GET https://api-singapore.klingai.com/openapi.json ->
    {"timestamp":"2026-08-12T17:15:56.665+0000","status":404,"error":"Not Found","message":"No message
    available","path":"/openapi.json"}
  note: >-
    The Kling REST API shares the Spring-style {timestamp,status,error,message,path} 404 envelope with
    Kwai for Business, while its authenticated surface uses {code,message,request_id}.
  method: probed
gaps:
- >-
  The Kwai for Business marketing API publishes no public error-code reference; only the framework-level
  404 envelope was observed.
- >-
  Kling AI's full business error-code table lives inside https://kling.ai/document-api, a JavaScript
  single-page application whose content is fetched at runtime and could not be harvested. Only code 1001
  and the 404 envelope are recorded, both from live probes.
- >-
  Kuaishou's mini-program client-side (ks.*) API error codes were not harvested; this catalogue covers
  the server-side surfaces only.
